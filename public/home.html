<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Vacation</title>
  <link rel ="icon" type ="image/x-icon" href="/public/images/icons8-favicon-94.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="top-nav">
    <span class="logo-icon">🏖️</span>
    <span class="logo-text">Book Your Vacation</span>
  </nav>

  <!-- Hero Banner Header -->
  <header class="hero-header">
    <img src="/public/images/vacation.jpeg" alt="Dream Vacation Beach" class="banner-img">
    <div class="header-content">
      <h1>Book Your Dream Vacation</h1>
      <p>Explore destinations around the world in just a few clicks</p>
    </div>
  </header>

  <!-- Form Card Section -->
  <main class="main-container">
    <div class="card-container">
      <form id="vacationForm" action="/api/book-vacation" method="POST" novalidate>
        
        <div class="form-group">
          <label for="destination">Destination</label>
          <select id="destination" name="destination" required>
            <option value="" disabled selected>Dream Vacation</option>
            <option value="Paris, France">Paris, France</option>
            <option value="Bali, Indonesia">Bali, Indonesia</option>
            <option value="Tokyo, Japan">Tokyo, Japan</option>
            <option value="New, York">New, York</option>
            <option value="Rome, Italy">Rome, Italy</option>
          </select>
          <span class="error-msg" id="destError">Please choose a destination.</span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="departureDate">Departure Date</label>
            <input type="date" id="departureDate" name="departureDate" required>
            <span class="error-msg" id="dateError">Please select a valid date.</span>
          </div>

          <div class="form-group">
            <label for="travelers">Number of Travelers</label>
            <input type="number" id="travelers" name="travelers" min="1" max="10" value="2" required>
            <span class="error-msg" id="travelerError">Enter 1 to 10 travelers.</span>
          </div>
        </div>

        <button type="submit" id="submitBtn">Find My Vacation</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
